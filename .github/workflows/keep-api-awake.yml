# Render's free plan puts the API to sleep after ~15 minutes without traffic, so the first
# visitor waits 30-60 seconds. This pings it every 10 minutes. Not needed on a paid Render plan.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl --silent --show-error --max-time 90 --retry 2 https://gul-275k.onrender.com/ > /dev/null
